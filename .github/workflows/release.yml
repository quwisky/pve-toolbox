name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_as:
        description: Stable version to propose, for example 0.4.2
        required: false
        type: string
      repair_apt:
        description: Re-sign and publish the latest stable APT repository
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-master
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release-please:
    name: Propose or create release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release-created: ${{ steps.automatic.outputs.release_created || steps.manual.outputs.release_created }}
      repair: ${{ steps.repair.outputs.repair }}
      prs-created: ${{ steps.automatic.outputs.prs_created || steps.manual.outputs.prs_created }}
      pr: ${{ steps.automatic.outputs.pr || steps.manual.outputs.pr }}
      tag: ${{ steps.automatic.outputs.tag_name || steps.manual.outputs.tag_name || steps.repair.outputs.tag }}
      version: ${{ steps.automatic.outputs.version || steps.manual.outputs.version || steps.repair.outputs.version }}
      sha: ${{ steps.automatic.outputs.sha || steps.manual.outputs.sha || steps.repair.outputs.sha }}
    steps:
      - name: Check out source
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Guard manual release request
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.repair_apt }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AS: ${{ inputs.release_as }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          [[ $RELEASE_AS =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          current=$(<VERSION)
          dpkg --compare-versions "$current" lt "$RELEASE_AS"
          release_tag="v$RELEASE_AS"
          remote_tag=$(git ls-remote --tags origin "refs/tags/$release_tag")
          if [[ -n $remote_tag ]]; then
            printf 'release tag already exists: %s\n' "$release_tag" >&2
            exit 1
          fi
          release_tags=$(gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[].tag_name')
          if grep -Fxq "$release_tag" <<< "$release_tags"; then
            printf 'GitHub release already exists: %s\n' "$release_tag" >&2
            exit 1
          fi

      - name: Resolve latest release for APT repair
        if: github.event_name == 'workflow_dispatch' && inputs.repair_apt
        id: repair
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_AS: ${{ inputs.release_as }}
        run: |
          test "$GITHUB_REF" = refs/heads/master
          test -z "$RELEASE_AS"
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest")
          tag=$(jq -r '.tag_name // empty' <<< "$latest")
          [[ $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version=${tag#v}
          sha=$(git rev-list -n 1 "$tag")
          ./scripts/verify-latest-release.sh "$tag" "$sha"
          asset_names=$(jq -r '.assets[].name' <<< "$latest")
          grep -Fxq "pve-toolbox_${version}_all.deb" <<< "$asset_names"
          grep -Fxq SHA256SUMS <<< "$asset_names"
          {
            printf 'repair=true\n'
            printf 'tag=%s\n' "$tag"
            printf 'version=%s\n' "$version"
            printf 'sha=%s\n' "$sha"
          } >> "$GITHUB_OUTPUT"

      - name: Run Release Please
        if: github.event_name == 'push'
        id: automatic
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Run Release Please for requested version
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.repair_apt }}
        id: manual
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          release-as: ${{ inputs.release_as }}

      - name: Validate created release
        if: steps.automatic.outputs.release_created == 'true' || steps.manual.outputs.release_created == 'true'
        env:
          RELEASE_SHA: ${{ steps.automatic.outputs.sha || steps.manual.outputs.sha }}
          RELEASE_TAG: ${{ steps.automatic.outputs.tag_name || steps.manual.outputs.tag_name }}
          RELEASE_VERSION: ${{ steps.automatic.outputs.version || steps.manual.outputs.version }}
        run: |
          [[ $RELEASE_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$RELEASE_SHA" = "$GITHUB_SHA"

  sync-debian-changelog:
    name: Sync Debian release notes
    needs: release-please
    if: needs.release-please.outputs.prs-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Validate release pull request
        id: release-pr
        env:
          PR_JSON: ${{ needs.release-please.outputs.pr }}
        run: |
          branch=$(jq -r '.headBranchName // empty' <<< "$PR_JSON")
          number=$(jq -r '.number // empty' <<< "$PR_JSON")
          [[ $branch =~ ^release-please--branches--master([/-].*)?$ ]]
          [[ $number =~ ^[1-9][0-9]*$ ]]
          {
            printf 'branch=%s\n' "$branch"
            printf 'number=%s\n' "$number"
          } >> "$GITHUB_OUTPUT"

      - name: Check out release pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.release-pr.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Synchronize Debian changelog
        run: |
          changelog_date=$(git log -1 --format=%aD -- CHANGELOG.md)
          DEBIAN_CHANGELOG_DATE="$changelog_date" \
            ./scripts/sync-debian-changelog.sh
          test "$(<VERSION)" = "$(dpkg-parsechangelog -S Version)"

      - name: Commit synchronized changelog
        env:
          RELEASE_BRANCH: ${{ steps.release-pr.outputs.branch }}
        run: |
          git add debian/changelog
          if git diff --cached --quiet; then
            printf 'Debian changelog is already synchronized\n'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'chore(release): sync debian changelog'
          git push origin "HEAD:$RELEASE_BRANCH"

  build:
    name: Build and validate release package
    needs: release-please
    if: needs.release-please.outputs.release-created == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  attest:
    name: Attest tested package
    needs: [release-please, build]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package-artifact }}
          path: dist

      - name: Verify tested package
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.package-sha256 }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          (cd dist && sha256sum --check SHA256SUMS)
          package="dist/pve-toolbox_${RELEASE_VERSION}_all.deb"
          test -f "$package"
          test "$(sha256sum "$package" | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Generate build provenance
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Stage provenance bundle
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          install -d provenance
          install -m 0644 "$BUNDLE_PATH" \
            "provenance/pve-toolbox_${RELEASE_VERSION}_provenance.json"

      - name: Upload provenance bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pve-toolbox-provenance-${{ github.sha }}
          path: provenance/*.json
          if-no-files-found: error
          retention-days: 14

  publish-apt:
    name: Sign and publish APT repository
    needs: [release-please, build, attest]
    if: |
      always() &&
      !cancelled() &&
      (
        (
          needs.release-please.outputs.release-created == 'true' &&
          needs.build.result == 'success' &&
          needs.attest.result == 'success'
        ) ||
        needs.release-please.outputs.repair == 'true'
      )
    outputs:
      apt-sha: ${{ steps.published-apt.outputs.sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    concurrency:
      group: apt-publish
      cancel-in-progress: false
    permissions:
      contents: write
    environment: release
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download tested package
        if: needs.release-please.outputs.release-created == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package-artifact }}
          path: dist

      - name: Download published package for repair
        if: needs.release-please.outputs.repair == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir dist
          package_name="pve-toolbox_${RELEASE_VERSION}_all.deb"
          gh release download "$RELEASE_TAG" \
            --pattern "$package_name" --pattern SHA256SUMS --dir dist
          test -f "dist/$package_name"
          test -f dist/SHA256SUMS
          (cd dist && sha256sum --check SHA256SUMS)

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            apt-utils dpkg-dev gnupg rsync

      - name: Validate release inputs
        env:
          EXPECTED_SHA256: ${{ needs.build.outputs.package-sha256 }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          REPAIR_MODE: ${{ needs.release-please.outputs.repair }}
        run: |
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          if [[ $REPAIR_MODE == true ]]; then
            ./scripts/verify-latest-release.sh "$RELEASE_TAG" "$RELEASE_SHA"
          else
            test "$RELEASE_SHA" = "$GITHUB_SHA"
            test "$(<VERSION)" = "$RELEASE_VERSION"
            test "$(dpkg-parsechangelog -S Version)" = "$RELEASE_VERSION"
          fi
          (cd dist && sha256sum --check SHA256SUMS)
          package="dist/pve-toolbox_${RELEASE_VERSION}_all.deb"
          test "$(dpkg-deb --field "$package" Package)" = pve-toolbox
          test "$(dpkg-deb --field "$package" Version)" = "$RELEASE_VERSION"
          if [[ $REPAIR_MODE != true ]]; then
            test "$(sha256sum "$package" | awk '{print $1}')" = "$EXPECTED_SHA256"
          fi

      - name: Import repository signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print toupper($10); exit }')
          test -n "$fingerprint"
          committed=$(gpg --batch --with-colons --show-keys keys/pve-toolbox.asc \
            | awk -F: '$1 == "fpr" { print toupper($10); exit }')
          test "$fingerprint" = "$committed"
          printf 'APT_SIGNING_FINGERPRINT=%s\n' "$fingerprint" >> "$GITHUB_ENV"

      - name: Check out APT repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apt_ref=$(git ls-remote --heads origin refs/heads/apt)
          if [[ -n $apt_ref ]]; then
            git clone --depth 1 --branch apt \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              apt-repo
          else
            mkdir apt-repo
            git -C apt-repo init
            git -C apt-repo remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Publish signed repository
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
          REPAIR_MODE: ${{ needs.release-please.outputs.repair }}
        run: |
          ./scripts/publish-apt-repo.sh \
            apt-repo "dist/pve-toolbox_${RELEASE_VERSION}_all.deb" \
            "$APT_SIGNING_FINGERPRINT" keys/pve-toolbox.asc 3
          git -C apt-repo config user.name github-actions[bot]
          git -C apt-repo config user.email \
            41898282+github-actions[bot]@users.noreply.github.com
          git -C apt-repo add --all
          if git -C apt-repo diff --cached --quiet; then
            printf 'APT repository already contains %s\n' "$RELEASE_TAG"
          else
            if [[ $REPAIR_MODE == true ]]; then
              message="chore(repo): repair $RELEASE_TAG metadata"
            else
              message="chore(repo): publish $RELEASE_TAG"
            fi
            git -C apt-repo commit -m "$message"
            git -C apt-repo push origin HEAD:apt
          fi

      - name: Record published APT repository
        id: published-apt
        run: |
          apt_sha=$(git -C apt-repo rev-parse HEAD)
          read -r remote_sha remote_ref \
            < <(git ls-remote --heads origin refs/heads/apt)
          test "$remote_ref" = refs/heads/apt
          test "$remote_sha" = "$apt_sha"
          printf 'sha=%s\n' "$apt_sha" >> "$GITHUB_OUTPUT"

  publish-release:
    name: Publish GitHub Release
    needs: [release-please, build, attest, publish-apt]
    if: needs.release-please.outputs.release-created == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download tested package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build.outputs.package-artifact }}
          path: dist

      - name: Download provenance bundle
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pve-toolbox-provenance-${{ github.sha }}
          path: provenance

      - name: Publish verified draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          test "$RELEASE_SHA" = "$GITHUB_SHA"
          test "$RELEASE_TAG" = "v$RELEASE_VERSION"
          (cd dist && sha256sum --check SHA256SUMS)
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$RELEASE_SHA"
          release_is_draft=$(gh release view "$RELEASE_TAG" --json isDraft \
            --jq .isDraft)
          [[ $release_is_draft == true || $release_is_draft == false ]]

          existing=$(mktemp -d)
          cleanup() {
            status=$?
            trap - EXIT
            if ! rm -rf -- "$existing"; then
              printf 'could not remove release verification directory: %s\n' \
                "$existing" >&2
              status=1
            fi
            exit "$status"
          }
          trap cleanup EXIT

          asset_names=$(gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[].name')
          for asset in dist/* provenance/*; do
            name=${asset##*/}
            if grep -Fxq "$name" <<< "$asset_names"; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing"
              cmp -s "$asset" "$existing/$name" || {
                printf 'release asset exists with different bytes: %s\n' "$name" >&2
                exit 1
              }
            else
              if [[ $release_is_draft != true ]]; then
                printf 'published release is missing required asset: %s\n' \
                  "$name" >&2
                exit 1
              fi
              gh release upload "$RELEASE_TAG" "$asset"
            fi
          done
          if [[ $release_is_draft == true ]]; then
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            printf 'GitHub Release is already published and verified: %s\n' \
              "$RELEASE_TAG"
          fi

          for asset in dist/* provenance/*; do
            name=${asset##*/}
            if [[ ! -f $existing/$name ]]; then
              gh release download "$RELEASE_TAG" --pattern "$name" --dir "$existing"
            fi
            cmp -s "$asset" "$existing/$name" || {
              printf 'published release asset differs: %s\n' "$name" >&2
              exit 1
            }
          done

      - name: Verify published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: ./scripts/verify-latest-release.sh "$RELEASE_TAG" "$RELEASE_SHA"

  pages-build:
    name: Assemble release Pages
    needs: [release-please, publish-apt, publish-release]
    if: |
      always() &&
      !cancelled() &&
      needs.publish-apt.result == 'success' &&
      (
        (
          needs.release-please.outputs.release-created == 'true' &&
          needs.publish-release.result == 'success'
        ) ||
        needs.release-please.outputs.repair == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out workflow source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify latest published release before assembly
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: ./scripts/verify-latest-release.sh "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          path: release-source

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: release-source/docs/requirements.txt

      - name: Build documentation
        working-directory: release-source
        run: |
          pip install -r docs/requirements.txt
          mkdocs build --strict

      - name: Include published APT repository
        working-directory: release-source
        env:
          APT_SHA: ${{ needs.publish-apt.outputs.apt-sha }}
        run: |
          [[ $APT_SHA =~ ^[0-9a-f]{40}$ ]]
          git init apt-repo
          git -C apt-repo remote add origin \
            "${{ github.server_url }}/${{ github.repository }}.git"
          git -C apt-repo fetch --depth 1 origin "$APT_SHA"
          test "$(git -C apt-repo rev-parse FETCH_HEAD)" = "$APT_SHA"
          git -C apt-repo checkout --detach "$APT_SHA"
          mkdir -p site/apt
          rsync -a --exclude .git apt-repo/ site/apt/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: release-source/site

  pages-deploy:
    name: Deploy release Pages
    needs: [release-please, publish-release, pages-build]
    if: |
      always() &&
      !cancelled() &&
      needs.pages-build.result == 'success' &&
      (
        (
          needs.release-please.outputs.release-created == 'true' &&
          needs.publish-release.result == 'success'
        ) ||
        needs.release-please.outputs.repair == 'true'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out workflow source and tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Verify latest published release before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.release-please.outputs.sha }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: ./scripts/verify-latest-release.sh "$RELEASE_TAG" "$RELEASE_SHA"

      - name: Deploy Pages
        id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
