name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Build package and publish APT repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go for actionlint
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts expect gnupg reprepro shellcheck \
            python3-pip rsync whiptail zsh
          pip install -r docs/requirements.txt
          install -d "$RUNNER_TEMP/actionlint"
          GOBIN="$RUNNER_TEMP/actionlint" \
            go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          printf '%s\n' "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Resolve release version
        run: |
          package_version=$(cat VERSION)
          test "$package_version" = "$(dpkg-parsechangelog -S Version)"

          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF" != refs/heads/master ]; then
              echo "manual releases must run from master" >&2
              exit 1
            fi
            release_tag="v$package_version"
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" \
              >/dev/null 2>&1; then
              if [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
                echo "release tag already exists: $release_tag" >&2
                exit 1
              fi
              git fetch --force origin \
                "refs/tags/$release_tag:refs/tags/$release_tag"
              test "$(git rev-parse "$release_tag^{commit}")" = "$GITHUB_SHA"
              echo "resuming the same release run for $release_tag"
            fi
          else
            release_tag=$GITHUB_REF_NAME
            test "${release_tag#v}" = "$package_version"
          fi

          echo "PACKAGE_VERSION=$package_version" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Test and build
        run: |
          make lint
          sudo env "PATH=$PATH" \
            TUI_TEST_REQUIRED=1 \
            ZSH_TEST_REQUIRED=1 \
            CB_GATE_TESTS_REQUIRED=1 \
            PACKAGING_TEST_REQUIRED=1 \
            PACKAGING_INSTALL_TEST_REQUIRED=1 \
            REPOSITORY_TEST_REQUIRED=1 \
            make test
          mkdocs build --strict
          dpkg-buildpackage --build=binary --no-sign
          mkdir -p dist
          cp "../pve-toolbox_${PACKAGE_VERSION}_all.deb" dist/
          (cd dist && sha256sum ./*.deb > SHA256SUMS)

      - name: Import repository signing key
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          test -n "$APT_SIGNING_KEY"
          printf '%s' "$APT_SIGNING_KEY" | gpg --batch --import
          fingerprint=$(gpg --batch --with-colons --list-secret-keys \
            | awk -F: '$1 == "fpr" { print $10; exit }')
          test -n "$fingerprint"
          echo "APT_SIGNING_FINGERPRINT=$fingerprint" >> "$GITHUB_ENV"

      - name: Check out repository history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git ls-remote --exit-code --heads origin apt >/dev/null 2>&1; then
            git clone --depth 1 --branch apt \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" apt-repo
          else
            mkdir apt-repo
            git -C apt-repo init
            git -C apt-repo remote add origin \
              "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi

      - name: Publish signed repository
        run: |
          ./scripts/publish-apt-repo.sh \
            apt-repo "dist/pve-toolbox_${PACKAGE_VERSION}_all.deb" \
            "$APT_SIGNING_FINGERPRINT" keys/pve-toolbox.asc
          git -C apt-repo config user.name github-actions[bot]
          git -C apt-repo config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C apt-repo add --all
          if git -C apt-repo diff --cached --quiet; then
            echo "APT repository already contains ${RELEASE_TAG}; continuing the release"
          else
            git -C apt-repo commit -m "chore(repo): publish ${RELEASE_TAG}"
            git -C apt-repo push origin HEAD:apt
          fi

      - name: Attach package to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] \
              && [ "$GITHUB_RUN_ATTEMPT" = 1 ]; then
              echo "GitHub release already exists: $RELEASE_TAG" >&2
              exit 1
            fi
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --generate-notes \
              dist/*
          fi

      - name: Combine docs and APT repository
        run: |
          mkdir -p site/apt
          rsync -a --exclude .git apt-repo/ site/apt/

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
